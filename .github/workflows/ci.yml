name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: remy_test
          POSTGRES_USER: remy_test
          POSTGRES_PASSWORD: remy-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remy_test -d remy_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REMY_TEST_POSTGRES_URL: postgresql+psycopg://remy_test:remy-test-only@127.0.0.1:5432/remy_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint and type-check
        run: make lint
      - name: Test
        run: make test
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false
      - name: Validate Terraform suggestions without AWS credentials
        run: make test-terraform
